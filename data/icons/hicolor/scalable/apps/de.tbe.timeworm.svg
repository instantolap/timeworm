<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#3584e4"/>
  <!-- Worm body (curved segments) -->
  <ellipse cx="52" cy="78" rx="16" ry="12" fill="#73d216" transform="rotate(-15 52 78)"/>
  <ellipse cx="64" cy="68" rx="14" ry="11" fill="#8ae234"/>
  <ellipse cx="76" cy="60" rx="14" ry="11" fill="#73d216"/>
  <ellipse cx="84" cy="48" rx="13" ry="11" fill="#8ae234"/>
  <!-- Worm head -->
  <circle cx="88" cy="36" r="14" fill="#4e9a06"/>
  <!-- Eyes -->
  <circle cx="83" cy="32" r="4" fill="white"/>
  <circle cx="93" cy="32" r="4" fill="white"/>
  <circle cx="84" cy="31" r="2" fill="#2E3436"/>
  <circle cx="94" cy="31" r="2" fill="#2E3436"/>
  <!-- Mouth -->
  <path d="M82 40 Q88 45 94 40" stroke="#2E3436" stroke-width="1.5" fill="none"/>
  <!-- Clock on worm body -->
  <circle cx="64" cy="68" r="8" fill="white" opacity="0.9"/>
  <circle cx="64" cy="68" r="7" fill="white" stroke="#2E3436" stroke-width="0.8"/>
  <line x1="64" y1="68" x2="64" y2="63" stroke="#2E3436" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="64" y1="68" x2="68" y2="68" stroke="#e01b24" stroke-width="1" stroke-linecap="round"/>
  <circle cx="64" cy="68" r="1" fill="#2E3436"/>
</svg>
